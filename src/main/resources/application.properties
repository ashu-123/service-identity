spring.application.name=service-identity

server.port=8081

# PostgreSQL Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/identity
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Flyway Configurations
flyway.enabled=true
flyways.locations=classpath:db/migration
#spring.flyway.clean-on-validation-error=true

# Actuator Configurations
management.endpoints.web.exposure.include=health,info

#JWT Configurations
jwt.issuer=service-identity
jwt.access-token-expiration=15m
jwt.private-key-location=keys/private_key.pem
jwt.public-key-location=keys/public_key.pem

#Refresh token Configurations
auth.refresh-token.expiration=30d
auth.refresh-token.cookie-name=refresh_token
auth.refresh-token.cookie-path=/api/auth
auth.refresh-token.secure=true
auth.refresh-token.same-site=lax

#OAuth Client Configurations

#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
#spring.security.oauth2.client.registration.google.scope=openid,profile,email

#Redis Configurations
spring.data.redis.host=localhost
spring.data.redis.port=6379

oauth2.frontend-callback-uri=http://localhost:4200/oauth/callback
oauth2.exchange-code-expiration=60s