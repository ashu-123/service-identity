spring.application.name=service-identity

server.port=8081

# PostgreSQL Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/identity
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Flyway Configurations
flyway.enabled=true
flyways.locations=classpath:db/migration

# Actuator Configurations
management.endpoints.web.exposure.include=health,info

#JWT Configurations
jwt.issuer=service-identity
jwt.access-token-expiration=15m
jwt.private-key-location=keys/private_key.pem
jwt.public-key-location=keys/public_key.pem

auth.refresh-token.expiration=30d
auth.refresh-token.cookie-name=refresh_token
auth.refresh-token.cookie-path=/api/auth
auth.refresh-token.secure=true
auth.refresh-token.same-site=lax


