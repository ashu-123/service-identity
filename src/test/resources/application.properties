#spring.flyway.enabled=false

# PostgreSQL Database Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/identity
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'


# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC


#JWT Configurations
jwt.issuer=service-identity
jwt.access-token-expiration=15m
jwt.private-key-location=keys/private_key.pem
jwt.public-key-location=keys/public_key.pem

#Refresh token Configurations
auth.refresh-token.expiration=30d
auth.refresh-token.cookie-name=refresh_token
auth.refresh-token.cookie-path=/api/auth
auth.refresh-token.secure=true
auth.refresh-token.same-site=lax

#OAuth Client Configurations

#Redis Configurations
spring.data.redis.host=localhost
spring.data.redis.port=6379

oauth2.frontend-callback-uri=http://localhost:4200/oauth/callback
oauth2.exchange-code-expiration=60s